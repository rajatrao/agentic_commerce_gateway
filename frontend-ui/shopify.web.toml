name = "React Router"
roles = ["frontend", "backend"]
webhooks_path = "/webhooks/app/uninstalled"
# Fixed so backend-engine reaches the app at http://frontend:3000 inside docker compose.
port = 3000

[commands]
predev = "npx prisma generate"
dev = "npx prisma migrate deploy && npx react-router dev --host 0.0.0.0 --port 3000"
