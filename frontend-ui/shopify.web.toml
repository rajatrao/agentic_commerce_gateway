name = "React Router"
roles = ["frontend", "backend"]
webhooks_path = "/webhooks/app/uninstalled"
# Fixed port, on all interfaces, so backend-engine (in Docker) reaches the app at
# host.docker.internal:3000.
port = 3000

[commands]
predev = "npx prisma generate"
dev = "npx prisma migrate deploy && npx react-router dev --host 0.0.0.0"
