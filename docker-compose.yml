# Local development stack. Everything runs in Docker; see README "Local development".
#   docker compose run --rm keys                          # once: writes the keys to .env
#   docker compose up -d                                  # Postgres + backend-engine (:8000/docs)
#   docker compose run --rm frontend shopify app config link   # once: link your Partner app
#   docker compose run --rm --use-aliases frontend        # Shopify app on your dev store
#   AI_PROVIDER=ollama docker compose --profile ollama up -d   # optional: local Qwen model

name: agentic-commerce-gateway

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend-engine
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://gateway:gateway@postgres:5432/gateway
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      BACKEND_JWT_PRIVATE_KEY: ${BACKEND_JWT_PRIVATE_KEY:-}
      FRONTEND_INTERNAL_URL: http://frontend:3000
      PUBLIC_BASE_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8000}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      SHOPIFY_API_KEY: ${SHOPIFY_API_KEY:-}
      SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # AI enrichment provider: anthropic | ollama | openai_compatible (empty: anthropic when a
      # key is set, otherwise rules only). Set AI_PROVIDER=ollama to use the ollama profile.
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-http://ollama:11434}
      AI_API_KEY: ${AI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend-engine/app:/app/app
      - ./backend-engine/migrations:/app/migrations
      - ./backend-engine/tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The Shopify app. Runs `shopify app dev` (Shopify CLI is in the image), which logs in to your
  # Partner account, opens the tunnel, installs the app on your dev store and serves it on
  # port 3000. Interactive, so it is started with `docker compose run` instead of `up`.
  frontend:
    build:
      context: ./frontend-ui
      target: dev
    profiles: ["app"]
    stdin_open: true
    tty: true
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://gateway:gateway@postgres:5432/gateway?schema=shopify_app
      BACKEND_INTERNAL_URL: http://backend:8000
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8000}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      BACKEND_JWT_PUBLIC_KEY: ${BACKEND_JWT_PUBLIC_KEY:-}
    volumes:
      # The whole app, so `config link` and `deploy` update shopify.app.toml on your machine.
      - ./frontend-ui:/app
      # Keeps the image's Linux node_modules instead of the (absent) host folder.
      - /app/node_modules
      # Shopify CLI login, so you only sign in once.
      - shopify-cli:/root
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy

  # Writes the Ed25519 + Fernet keys to ./.env (`docker compose run --rm keys`, add --force to rotate).
  keys:
    image: node:22-alpine
    profiles: ["tools"]
    working_dir: /work
    volumes:
      - .:/work
    entrypoint: ["node", "scripts/generate-keys.mjs"]

  # Local LLM for AI enrichment. Only started with the "ollama" profile.
  # Runs on CPU; on a machine with an NVIDIA GPU, add a `deploy.resources` GPU reservation.
  ollama:
    image: ollama/ollama:0.9.6
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Downloads the model into the ollama volume once (about 5 GB for qwen3:8b), then exits.
  ollama-pull:
    image: ollama/ollama:0.9.6
    profiles: ["ollama"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${AI_MODEL:-qwen3:8b}"]
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  pgdata:
  ollama:
  shopify-cli:
