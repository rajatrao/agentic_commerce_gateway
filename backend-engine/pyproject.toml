[project]
name = "backend-engine"
version = "0.1.0"
description = "Agentic Commerce Gateway: FastAPI engine for catalog auditing, agent protocols and checkout"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.15.0",
    "argon2-cffi>=25.1.0",
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.2",
    "extruct>=0.18.0",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "mcp>=2.3.0",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.2.10",
    "pydantic-settings>=2.16.0",
    "pyjwt[crypto]>=2.15.1",
    "shopifyapi>=12.7.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "sqlmodel>=0.0.48",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
