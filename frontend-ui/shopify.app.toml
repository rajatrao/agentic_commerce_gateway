# Shopify app configuration. Run `npm run config:link` on your machine to fill in
# client_id / application_url for your Partner app.
client_id = "cf510b5aed1171f652f789436eefad21"
name = "Agentic Commerce Gateway"
application_url = "https://example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[access_scopes]
# write_products: catalog audit, llm.txt, and writing merchant-approved attribute values to
#   product metafields (catalog enrichment). Includes read access. Never used without review.
# read_inventory: catalog audit
# read_themes: installation checker app-block detection
# write_draft_orders/read_shipping: price agent carts with draftOrderCalculate (no orders are created)
# read_orders: orders/create webhook links each order back to its agent cart. Needs protected
#   customer data access (Partner dashboard > API access); only order ids are stored.
# write_metaobjects: adding the category metaobject entries behind Shopify's standard
# category metafields (shopify.material, shopify.activity) when publishing approved values.
scopes = "write_products,write_metaobjects,read_inventory,read_themes,write_draft_orders,read_shipping,read_orders"

[auth]
redirect_urls = ["https://example.com/auth/callback"]

[webhooks]
api_version = "2026-10"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx (forwards to backend-engine)
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  # Handled by: /app/routes/webhooks.orders.create.tsx (forwards to backend-engine)
  [[webhooks.subscriptions]]
  topics = ["orders/create"]
  uri = "/webhooks/orders/create"

  # Handled by: /app/routes/webhooks.products.tsx (forwards to backend-engine)
  [[webhooks.subscriptions]]
  topics = ["products/update", "products/delete"]
  uri = "/webhooks/products"

  # Mandatory GDPR compliance topics. Handled by /app/routes/webhooks.compliance.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]

[pos]
embedded = false
